<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }

        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Markdown to HTML Converter</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="markdownInput" class="block text-gray-700 text-sm font-bold mb-2">Markdown Input:</label>
                <textarea id="markdownInput" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline h-96" placeholder="Enter Markdown here..."></textarea>
            </div>
            <div>
                <label for="htmlOutput" class="block text-gray-700 text-sm font-bold mb-2">HTML Output:</label>
                <div id="htmlOutput" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline h-96 bg-white overflow-auto markdown-body"></div>
            </div>
        </div>
    </div>
    <script>
        const markdownInput = document.getElementById('markdownInput');
        const htmlOutput = document.getElementById('htmlOutput');

        markdownInput.addEventListener('input', function() {
            const markdownText = markdownInput.value;
            const htmlText = marked.parse(markdownText);
            htmlOutput.innerHTML = htmlText;
        });

        // Optionally load the markdown file automatically, if present
        fetch('input.md')
            .then(response => {
                if (!response.ok) {
                    console.log("input.md not found, ignoring.");
                    return Promise.reject('input.md not found');
                }
                return response.text();
            })
            .then(markdown => {
                markdownInput.value = markdown;
                htmlOutput.innerHTML = marked.parse(markdown);
            })
            .catch(error => {
                console.warn('Error loading input.md:', error);
            });
    </script>
</body>
</html>
